name: squad-security-scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
      
      - name: Build (for CodeQL)
        run: |
          mkdir -p $GITHUB_WORKSPACE/codeql-scratch
          cd $GITHUB_WORKSPACE/codeql-scratch
          mvn -B clean compile -f $GITHUB_WORKSPACE/pom.xml
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: /language:${{ matrix.language }}
  
  dependency-check:
    name: Dependency Check (OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run dependency check
        uses: jeremylong/DependencyCheck_Action@main
        with:
          project: 'squad-service'
          path: '.'
          format: 'SARIF'
          args: >
            --enableExperimental
      
      - name: Upload Dependency Check Report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: dependency-check-report.sarif
      
      - name: Comment PR with Dependency Issues
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔒 Security scans complete. Check "Security" tab for CodeQL + Dependency Check results.'
            });

  sast:
    name: SAST (SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run SpotBugs
        run: mvn spotbugs:check
      
      - name: Archive SpotBugs Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
