name: squad-ci-lint-test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/squad-ci-lint-test.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Lint (CheckStyle)
        run: mvn checkstyle:check
      
      - name: Tests + Coverage
        run: mvn clean test jacoco:report
      
      - name: Check Coverage Threshold
        run: mvn jacoco:check
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
      
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/**/*.xml
          check_name: Test Results
      
      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('./target/site/jacoco/index.html', 'utf8');
            const match = coverage.match(/Total<\/th><td class="bar">[\d.]+%<\/td><td class="ctr2">([\d.]+)%/);
            const percent = match ? match[1] : 'N/A';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📊 **Coverage Report**\n\n- Coverage: ${percent}%\n- Target: 75%\n- Status: ${parseFloat(percent) >= 75 ? '✅ PASS' : '❌ FAIL'}`
            });
